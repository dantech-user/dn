name: Gerar APK Hydra Agro

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HYDRA_APP_URL: ${{ secrets.HYDRA_APP_URL }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Validar código
        run: npm test

      - name: Conferir endereço publicado
        run: test -n "$HYDRA_APP_URL"

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícone e splash nativa
        run: |
          node scripts/generate-native-assets.js
          npx capacitor-assets generate --android

      - name: Sincronizar aplicativo
        run: |
          npx cap sync android
          npm run android:configure

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: hydra-agro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
